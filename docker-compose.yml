version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://server:10000
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:?set NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      - DEVICE_SESSION_SECRET=${DEVICE_SESSION_SECRET:-}
    depends_on:
      - redis
      - server
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  server:
    # Context is the repo root: server/tsconfig.server.json extends ../tsconfig.json
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - REDIS_URL=redis://redis:6379
      # PostgreSQL is not part of this compose file; point this at your own instance
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?set NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY}
      - DEVICE_SESSION_SECRET=${DEVICE_SESSION_SECRET:-}
      - VAPID_PUBLIC=${VAPID_PUBLIC:-}
      - VAPID_PRIVATE=${VAPID_PRIVATE:-}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:

networks:
  default:
    driver: bridge
