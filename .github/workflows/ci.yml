name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NODE_ENV: production
      NEXTAUTH_SECRET: development-secret
      NEXTAUTH_URL: https://www.qcnote.com
    concurrency:
      group: ci-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install dependencies
        env:
          NPM_CONFIG_PRODUCTION: false
        run: npm ci --include=dev

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: CI=true npm run test -- --run --reporter=dot

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NODE_ENV: production
      NEXTAUTH_SECRET: development-secret
      NEXTAUTH_URL: https://www.qcnote.com
    needs: build
    concurrency:
      group: e2e-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          NPM_CONFIG_PRODUCTION: false
        run: npm ci --include=dev

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e -- --reporter=dot

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore


