version: 2
updates:
  # Enable version updates for npm (Frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "NENWA618"
    assignees:
      - "NENWA618"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    ignore:
      # Next 16.4 的 Turbopack 产物会在静态 HTML 里注入内联 <script>，被生产 CSP（无 'unsafe-inline'）拦截，
      # 导致页面卡在加载界面。修好 CSP 方案之前先停在 16.3.x。
      - dependency-name: "next"
        versions: [">=16.4.0"]
      - dependency-name: "eslint-config-next"
        versions: [">=16.4.0"]

  # Enable version updates for npm (Backend)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "NENWA618"
    assignees:
      - "NENWA618"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "NENWA618"
    assignees:
      - "NENWA618"
    commit-message:
      prefix: "ci"
      include: "scope"