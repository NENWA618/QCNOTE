<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c8b8c8" />
    <title>离线 - QCNOTE</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #c8b8c8; color: #3b2f3b; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; }
      h1 { font-size: 1.4rem; margin: 0 0 12px; }
      p { line-height: 1.6; margin: 0 0 20px; }
      a, button { display: inline-block; font: inherit; color: #fff; background: #7a5f86; border: 0; border-radius: 10px; padding: 10px 20px; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>这个页面还没有被缓存。你的笔记保存在本机，联网后重新打开即可；已访问过的页面（如笔记列表）可以离线使用。</p>
      <button onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
